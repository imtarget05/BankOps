name: Build & Deploy Quản Lý Kho Trà Sữa

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Canonical API = FastAPI (ADR-0001), host trên Modal (scale-to-zero, free tier).
  # Đây là URL công khai, KHÔNG phải secret. Đổi giá trị này nếu app Modal được
  # đổi tên (modal app `quan-ly-kho-tra-sua`, function `api`).
  API_BASE_URL: "https://imtarget05--quan-ly-kho-tra-sua-api.us-east.modal.run"

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in GOOGLE_CLIENT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ${v} chưa cấu hình (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Khớp deploy.yml + máy dev (3.24 không resolve được pdf ^3.12.0).
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Flutter analyze
        working-directory: frontend
        # --no-fatal-infos: chỉ chặn error + warning; info style không làm fail build.
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: frontend
        run: flutter test

      - name: Build Flutter Web (release)
        working-directory: frontend
        env:
          # FastAPI trên Modal (xem `env.API_BASE_URL` ở đầu workflow).
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          flutter build web \
            --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --dart-define=APP_ENV=production

      - name: Deploy to Cloudflare Workers Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Worker Assets sử dụng SPA fallback từ wrangler.tea-inventory.toml.
          # Không copy _redirects: Workers Assets không hỗ trợ redirect legacy.
          rm -rf frontend/build/worker-assets
          rsync -a --exclude='_redirects' frontend/build/web/ frontend/build/worker-assets/
          cp infra/cloudflare-pages/_headers frontend/build/worker-assets/_headers
          npx --yes wrangler@4 deploy --config infra/cloudflare-worker/wrangler.tea-inventory.toml

      - name: Smoke test (API health from deployed bundle)
        run: |
          curl -fsS -m 90 "${{ env.API_BASE_URL }}/api/v1/health/live" | grep -q '"status":"alive"'
          echo "Backend health OK: ${{ env.API_BASE_URL }}"

      - name: Print deployment URL
        run: |
          echo "✅ Flutter Web deployed to Cloudflare Workers Assets"
          echo "🌐 URL: https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev"

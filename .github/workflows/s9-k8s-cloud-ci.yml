name: S9 — Cloud CI Kubernetes Verification
run-name: "S9 Cloud CI Run #[{github.run_number}]"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile.serving'
      - 'backend/k8s/**'
      - 'backend/app/api/inference.py'
      - 'backend/app/services/drift_detection.py'

jobs:
  cloud-ci-kind-verified:
    name: CLOUD_CI_KIND_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
      MODEL_NAME: "DemandForecastModel"
      IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/quanlykho/model-serving"
      KIND_CLUSTER_NAME: "mlaas"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker BuildKit
        run: |
          export DOCKER_BUILDKIT=1
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Build model serving Docker image
        run: |
          cd backend && docker build \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -f Dockerfile.serving \
            .

      - name: Push image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<EOF
          EOF
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Install kind
        run: |
          [ $(uname -m) = x86_64 ] && ARCH=amd64 || ARCH=arm64
          curl -sSL "https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-${ARCH}" -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/

      - name: Create kind cluster
        run: |
          kind create cluster --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Load image into kind
        run: |
          kind load docker-image "${{ env.IMAGE_NAME }}:${{ github.sha }}" --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Apply K8s manifests
        run: |
          cd backend && kubectl apply -k k8s/

      - name: Wait for Deployment rollout
        run: |
          cd backend && kubectl rollout status deployment/model-serving -n ml-serving --timeout=120s

      - name: Verify Pod status
        run: |
          cd backend && kubectl get pods -n ml-serving -l app=model-serving -o wide

      - name: Test Readiness Probe
        run: |
          cd backend && kubectl wait --for=condition=ready pod -l app=model-serving -n ml-serving --timeout=60s
          SERVICE_IP=$(kubectl get svc model-serving -n ml-serving -o jsonpath='{.spec.clusterIP}')
          echo "Service ClusterIP: $SERVICE_IP"
          for i in $(seq 1 12); do
            STATUS=$(kubectl get pod -l app=model-serving -n ml-serving -o jsonpath='{.items[0].status.phase}')
            if [ "$STATUS" = "Running" ]; then
              echo "Pod is Running after $i seconds"
              break
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done

      - name: Test Liveness Probe
        run: |
          cd backend && POD_NAME=$(kubectl get pods -n ml-serving -l app=model-serving -o jsonpath='{.items[0].metadata.name}') && kubectl port-forward pod/$POD_NAME 8000:8000 -n ml-serving &
          PORT_FORWARD_PID=$!
          sleep 3
          curl -f http://localhost:8000/health && echo "Liveness probe PASSED" || echo "Liveness probe FAILED"
          kill $PORT_FORWARD_PID 2>/dev/null

      - name: Verify HPA configuration
        run: |
          cd backend && kubectl describe hpa model-serving-hpa -n ml-serving

      - name: Verify PDB behavior
        run: |
          cd backend && kubectl describe pdb model-serving-pdb -n ml-serving

      - name: Check rollout events
        run: |
          cd backend && kubectl get events -n ml-serving --sort-by=.metadata.creationTimestamp | tail -20

      - name: Upload k8s manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: backend/k8s/
          retention-days: 30

      - name: Upload debug info
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ci-debug
          path: |
            /tmp/kind-config
            /var/lib/kind
          retention-days: 7

      - name: Announce CLOUD_CI_KIND_VERIFIED
        if: always()
        run: |
          echo "========================================"
          echo "S9 KIND CLOUD CI COMPLETED"
          echo "Job: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Cluster: ${{ env.KIND_CLUSTER_NAME }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Export gate result
        id: gate-result
        run: |
          echo "gate=cloud_ci_kind_verified" >> $GITHUB_OUTPUT

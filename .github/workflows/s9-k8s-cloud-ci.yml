name: S9 — Cloud CI Kubernetes Verification
run-name: "S9 Cloud CI Run #[{github.run_number}]"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile.serving'
      - 'backend/k8s/**'
      - 'backend/app/api/inference.py'
      - 'backend/app/services/drift_detection.py'

jobs:
  cloud-ci-kind-verified:
    name: CLOUD_CI_KIND_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
      MODEL_NAME: "DemandForecastModel"
      IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/quanlykho/model-serving"
      KIND_CLUSTER_NAME: "mlaas"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker BuildKit
        run: |
          export DOCKER_BUILDKIT=1
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/s11-evidence"

      - name: Build model serving Docker image
        working-directory: backend
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -f Dockerfile.serving \
            .
          docker inspect --format='image_id={{.Id}} digest={{.RepoDigests}}' "${{ env.IMAGE_NAME }}:${{ github.sha }}" | tee "$RUNNER_TEMP/s11-evidence/image-digest.txt"

      - name: Push image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"
          docker inspect --format='{{json .RepoDigests}}' "${{ env.IMAGE_NAME }}:${{ github.sha }}" | tee -a "$RUNNER_TEMP/s11-evidence/image-digest.txt"

      - name: Install kind
        run: |
          [ $(uname -m) = x86_64 ] && ARCH=amd64 || ARCH=arm64
          curl -sSL "https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-${ARCH}" -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/

      - name: Create kind cluster
        run: |
          kind create cluster --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Load image into kind
        run: |
          kind load docker-image "${{ env.IMAGE_NAME }}:${{ github.sha }}" --name "${{ env.KIND_CLUSTER_NAME }}"
          kind load docker-image "${{ env.IMAGE_NAME }}:latest" --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Apply K8s manifests
        working-directory: backend
        run: |
          kubectl apply -f k8s/model-serving.yaml
          kubectl set image deployment/model-serving -n ml-serving inference=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl -n ml-serving get deployment model-serving "-o=jsonpath=image={.spec.template.spec.containers[0].image} sha=${{ github.sha }}" | tee "$RUNNER_TEMP/s11-evidence/rollout-image.txt"

      - name: "Debug: Describe Deployment"
        working-directory: backend
        run: |
          kubectl describe deployment model-serving -n ml-serving

      - name: "Debug: Pod Status + Events"
        working-directory: backend
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ml-serving -l app=model-serving -o wide
          echo "=== Events ==="
          kubectl get events -n ml-serving --sort-by=.metadata.creationTimestamp | tail -30

      - name: Wait for Deployment rollout
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/s11-evidence"
          set +e
          mkdir -p "$RUNNER_TEMP/s11-evidence"
          kubectl rollout status deployment/model-serving -n ml-serving --timeout=300s
          rc=$?
          set -e
          echo "rollout_rc=$rc" | tee "$RUNNER_TEMP/s11-evidence/rollout-status.txt"
          if [ "$rc" -ne 0 ]; then
            echo "=== rollout FAILED — collecting describe/events/logs/probe/image ==="
            kubectl describe deployment model-serving -n ml-serving > "$RUNNER_TEMP/s11-evidence/describe-deployment.txt" 2>&1 || true
            kubectl get events -n ml-serving --sort-by=.metadata.creationTimestamp > "$RUNNER_TEMP/s11-evidence/events.txt" 2>&1 || true
            kubectl get pods -n ml-serving -l app=model-serving -o wide > "$RUNNER_TEMP/s11-evidence/pods.txt" 2>&1 || true
            for pod in $(kubectl get pods -n ml-serving -l app=model-serving -o jsonpath='{.items[*].metadata.name}'); do
              kubectl describe pod "$pod" -n ml-serving > "$RUNNER_TEMP/s11-evidence/describe-pod-$pod.txt" 2>&1 || true
              kubectl logs "$pod" -n ml-serving --all-containers=true --tail=500 > "$RUNNER_TEMP/s11-evidence/logs-$pod.txt" 2>&1 || true
              kubectl get pod "$pod" -n ml-serving -o jsonpath='imageID={.status.containerStatuses[0].imageID} image={.status.containerStatuses[0].image}' > "$RUNNER_TEMP/s11-evidence/image-$pod.txt" 2>&1 || true
            done
            POD_NAME=$(kubectl get pods -n ml-serving -l app=model-serving -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD_NAME" ]; then
              kubectl port-forward "pod/$POD_NAME" 8000:8000 -n ml-serving >/tmp/pf.log 2>&1 &
              PF_PID=$!
              sleep 3
              curl -sv http://localhost:8000/health > "$RUNNER_TEMP/s11-evidence/probe-response.txt" 2>&1 || true
              kill $PF_PID 2>/dev/null || true
            fi
            exit $rc
          fi

      - name: Verify Pod status
        working-directory: backend
        run: |
          kubectl get pods -n ml-serving -l app=model-serving -o wide

      - name: Assert 2/2 Rollout, Zero Restarts, and Scaled Old RS
        working-directory: backend
        run: |
          set -euo pipefail
          echo "=== 1. Assert Updated Replicas (2/2) ==="
          UPDATED=$(kubectl -n ml-serving get deployment model-serving -o jsonpath='{.status.updatedReplicas}')
          echo "Updated replicas: $UPDATED"
          [ "$UPDATED" -eq 2 ]

          echo "=== 2. Assert Available Replicas (2/2) ==="
          AVAILABLE=$(kubectl -n ml-serving get deployment model-serving -o jsonpath='{.status.availableReplicas}')
          echo "Available replicas: $AVAILABLE"
          [ "$AVAILABLE" -eq 2 ]

          echo "=== 3. Assert Old ReplicaSets Scaled to 0 ==="
          CURRENT_REV=$(kubectl -n ml-serving get deployment model-serving -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
          echo "Current deployment revision: $CURRENT_REV"
          OLD_RS_REPLICAS=$(kubectl -n ml-serving get rs -l app=model-serving -o json | jq '[.items[] | select(.metadata.annotations["deployment.kubernetes.io/revision"] != "'"$CURRENT_REV"'") | .status.replicas // 0] | add // 0')
          echo "Replicas in old ReplicaSets: $OLD_RS_REPLICAS"
          [ "$OLD_RS_REPLICAS" -eq 0 ]

          echo "=== 4. Assert 0 Container Restarts ==="
          RESTARTS=$(kubectl -n ml-serving get pods -l app=model-serving -o jsonpath='{range .items[*].status.containerStatuses[*]}{.restartCount}{" "}{end}')
          echo "Pod restart counts: $RESTARTS"
          TOTAL_RESTARTS=0
          for r in $RESTARTS; do
            TOTAL_RESTARTS=$((TOTAL_RESTARTS + r))
          done
          echo "Total container restarts: $TOTAL_RESTARTS"
          [ "$TOTAL_RESTARTS" -eq 0 ]

          echo "=== 5. Assert /health Healthy Across All Running Pods ==="
          PORT=8080
          for POD_NAME in $(kubectl -n ml-serving get pods -l app=model-serving --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}'); do
            echo "Checking health for $POD_NAME on local port $PORT..."
            kubectl -n ml-serving port-forward "pod/$POD_NAME" "$PORT:8000" &
            PF_PID=$!
            sleep 4
            RESP=$(curl -sf "http://localhost:$PORT/health" || echo '{"status":"failed"}')
            kill -9 $PF_PID 2>/dev/null || true
            sleep 1
            echo "$POD_NAME response: $RESP"
            echo "$RESP" | grep -q '"status":"healthy"'
            PORT=$((PORT + 1))
          done
          echo "=== S9 GATE CRITERIA FULLY VERIFIED ==="

      - name: Verify Service ClusterIP Connectivity
        working-directory: backend
        run: |
          SERVICE_IP=$(kubectl get svc model-serving -n ml-serving -o jsonpath='{.spec.clusterIP}')
          echo "Service ClusterIP: $SERVICE_IP"

      - name: Verify HPA configuration
        working-directory: backend
        run: |
          kubectl describe hpa model-serving-hpa -n ml-serving

      - name: Verify PDB behavior
        working-directory: backend
        run: |
          kubectl describe pdb model-serving-pdb -n ml-serving

      - name: Check rollout events
        working-directory: backend
        run: |
          kubectl get events -n ml-serving --sort-by=.metadata.creationTimestamp | tail -20

      - name: Upload k8s manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: backend/k8s/
          retention-days: 30

      - name: Upload S9 rollout evidence (image digest + describe/events/logs/probe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s9-rollout-evidence
          path: ${{ runner.temp }}/s11-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug info
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ci-debug
          path: |
            /tmp/kind-config
            /var/lib/kind
          retention-days: 7

      - name: Announce CLOUD_CI_KIND_VERIFIED
        if: success()
        run: |
          echo "========================================"
          echo "S9 KIND CLOUD CI VERIFIED"
          echo "Job: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Cluster: ${{ env.KIND_CLUSTER_NAME }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Announce CLOUD_CI_KIND_FAILED
        if: failure()
        run: |
          echo "========================================"
          echo "S9 KIND CLOUD CI FAILED"
          echo "Job: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Cluster: ${{ env.KIND_CLUSTER_NAME }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Export gate result
        id: gate-result
        if: success()
        run: |
          echo "gate=cloud_ci_kind_verified" >> $GITHUB_OUTPUT
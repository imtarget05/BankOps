name: S11 — Cloud CI Full E2E Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/tests/test_ml_training.py'
      - 'backend/tests/test_e2e_verify.py'
      - 'backend/tests/test_ml_registry.py'
      - 'backend/tests/test_inference_api.py'
      - 'backend/tests/test_drift_detection.py'
      - 'backend/tests/test_airflow_dags.py'
      - 'backend/tests/test_airflow_ingest_tasks.py'
      - 'backend/scripts/e2e_verify.py'
      - 'backend/app/services/'
      - 'backend/app/api/inference.py'
      - 'backend/alembic/**'
      - 'backend/pyproject.toml'

jobs:
  cloud-ci-e2e-verified:
    name: CLOUD_CI_E2E_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankops_test
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Install Airflow (isolated metadata DB)
        run: |
          python -m pip install --quiet "apache-airflow==2.10.4" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.11.txt"
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow-home"
          mkdir -p "$AIRFLOW_HOME"
          echo "AIRFLOW_HOME=$AIRFLOW_HOME" >> $GITHUB_ENV
          airflow db migrate

      - name: Install dependencies (before Airflow DAG)
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Prepare Airflow DAG temp dirs
        run: |
          mkdir -p "$RUNNER_TEMP/mlflow-s11/mlruns"
          mkdir -p "$RUNNER_TEMP/s11-evidence"

      - name: Airflow DAG run (isolated container metadata DB)
        working-directory: backend
        env:
          PATH: "/home/runner/.local/bin:$PATH"
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          QLK_INGEST_DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          QLK_INGEST_ALLOW_ANY_DB: "1"
          MLFLOW_TRACKING_URI: "sqlite:///$RUNNER_TEMP/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_ARTIFACT_DIR: "$RUNNER_TEMP/mlflow-s11/mlruns"
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
        run: |
          set -e
          poetry run pip install pytest --quiet
          poetry run python -m pytest tests/test_airflow_dags.py -v --no-header --tb=short
          # Run the real DAG end-to-end on the isolated metadata DB (no scheduler needed).
          # Machine-readable DAG-run artifact (task list + config on this SHA).
          poetry run python - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, "infra/airflow/dags")
          import inventory_ingestion as dag_module
          dag = dag_module.dag
          payload = {
              "dag_id": dag.dag_id,
              "tasks": sorted(dag.task_ids),
              "task_count": len(dag.task_ids),
              "catchup": dag.catchup,
              "max_active_runs": dag.max_active_runs,
              "schedule": str(dag.schedule),
              "sha": os.environ.get("GITHUB_SHA", ""),
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "s11-evidence" / "dag-run.json"
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Install dependencies
        working-directory: backend
        env:
          PATH: "/home/runner/.local/bin:$PATH"
        run: poetry install --no-interaction --no-ansi

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run alembic upgrade head

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          APP_ENV: demo
          DEMO_MODE: "true"
        run: poetry run python -m app.seed

      - name: Run ML Training
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///$RUNNER_TEMP/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_TRACKING_URI: "sqlite:///$RUNNER_TEMP/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_ARTIFACT_DIR: "$RUNNER_TEMP/mlflow-s11/mlruns"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run pytest tests/test_ml_training.py tests/test_ml_registry.py -v --no-header --tb=short

      - name: Promote model to Production
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///$RUNNER_TEMP/mlflow-s11/mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: |
          set -e
          echo "=== Promoting model to Production ==="
          poetry run python promote_model.py

      - name: FastAPI Serving Smoke Test
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: |
          echo "=== FastAPI Serving Smoke Test ==="
          poetry run python scripts/smoke_test.py

      - name: Drift Detection Check
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run pytest tests/test_drift_detection.py tests/test_e2e_verify.py -v --no-header --tb=short

      - name: E2E Verification Summary
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: |
          echo "=== S11 machine-readable evidence ==="
          cat "$RUNNER_TEMP/s11-evidence/dag-run.json"
          cat "$RUNNER_TEMP/s11-evidence/e2e-chain.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-artifacts
          path: |
            ${{ runner.temp }}/s11-evidence/
            ${{ runner.temp }}/mlflow-s11/
          retention-days: 30

      - name: Announce CLOUD_CI_E2E_VERIFIED
        if: always()
        run: |
          echo "========================================"
          echo "S11 CLOUD CI E2E VERIFIED"
          echo "Run: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Export gate result
        id: gate-result
        run: |
          echo "gate=cloud_ci_e2e_verified" >> $GITHUB_OUTPUT
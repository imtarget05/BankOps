name: S11 — Cloud CI Full E2E Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/tests/test_ml_training.py'
      - 'backend/tests/test_e2e_verify.py'
      - 'backend/tests/test_ml_registry.py'
      - 'backend/tests/test_inference_api.py'
      - 'backend/tests/test_drift_detection.py'
      - 'backend/app/services/'
      - 'backend/scripts/e2e_verify.py'
      - 'backend/alembic/**'
      - 'backend/pyproject.toml'

jobs:
  cloud-ci-e2e-verified:
    name: CLOUD_CI_E2E_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankops_test
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Install dependencies
        working-directory: backend
        env:
          PATH: "/home/runner/.local/bin:$PATH"
        run: poetry install --no-interaction --no-ansi

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run alembic upgrade head

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run python -m app.seed

      - name: Train and register synthetic demand model
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run python -c 'from app.services.ml_training import run_full_pipeline; run_full_pipeline()'

      - name: Verify and promote registered model
        working-directory: backend
        env:
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
          E2E_EVIDENCE_PATH: "evidence/e2e-registry.json"
        run: poetry run python scripts/e2e_verify.py

      - name: Validate Airflow DAG contracts
        working-directory: backend
        run: poetry run pytest tests/test_airflow_dags.py -v --no-header --tb=short

      - name: FastAPI Serving Smoke Test
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: |
          poetry run python - <<'PY'
          from fastapi.testclient import TestClient
          from app.api.inference import app, reset_model_cache

          reset_model_cache()
          client = TestClient(app)
          health_response = client.get('/health')
          assert health_response.status_code == 200, health_response.text
          assert health_response.json().get('status') == 'healthy', health_response.text
          predict_response = client.post('/predict', json={'period': 1, 'month': 6})
          assert predict_response.status_code == 200, predict_response.text
          print(predict_response.json())
          PY

      - name: Drift Detection Check
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run pytest tests/test_drift_detection.py -v --no-header --tb=short

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-artifacts
          path: |
            backend/evidence/e2e-registry.json
            /tmp/mlruns
          retention-days: 30

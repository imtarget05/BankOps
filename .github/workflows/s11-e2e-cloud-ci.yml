name: S11 — Cloud CI Full E2E Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/tests/test_ml_training.py'
      - 'backend/tests/test_ml_registry.py'
      - 'backend/tests/test_inference_api.py'
      - 'backend/tests/test_drift_detection.py'
      - 'backend/app/services/'
      - 'backend/alembic/**'
      - 'backend/pyproject.toml'

jobs:
  cloud-ci-e2e-verified:
    name: CLOUD_CI_E2E_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankops_test
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Install dependencies
        working-directory: backend
        env:
          PATH: "/home/runner/.local/bin:$PATH"
        run: poetry install --no-interaction --no-ansi

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run alembic upgrade head

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run python -m app.seed

      - name: Run ML Training
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run pytest tests/test_ml_training.py -v --no-header

      - name: MLflow Model Registry Setup
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run python scripts/e2e_verify.py

      - name: FastAPI Serving Smoke Test
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
          MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run pytest tests/test_inference_api.py -v --no-header

      - name: Drift Detection Check
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run pytest tests/test_drift_detection.py -v --no-header

      - name: E2E Verification Summary
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@postgres:5432/bankops_test"
        run: poetry run python scripts/e2e_verify.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-artifacts
          path: |
            backend/tests
            /tmp/mlruns
          retention-days: 30
name: S10 — Cloud CI Acceptance Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/tests/test_acceptance_qa.py'
      - 'backend/alembic/**'
      - 'backend/app/**'

jobs:
  cloud-ci-acceptance-verified:
    name: CLOUD_CI_ACCEPTANCE_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankops_test
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        temp_files: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi

      - name: Run Alembic migrations
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test"
        run: |
          cd backend
          poetry run alembic upgrade head

      - name: Seed database
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test"
        run: |
          cd backend
          poetry run python -m app.seed

      - name: Run acceptance tests
        env:
          DATABASE_URL: "postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test"
        run: |
          cd backend
          poetry run pytest tests/test_acceptance_qa.py -v --no-header

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-reports
          path: |
            backend/tests/reports
          retention-days: 30
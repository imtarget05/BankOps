name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff
        # Pin đúng version đã fix hết cảnh báo — ruff mới thường thêm rule mới
        # (vd 0.17.0 bắt I001/UP041 mà 0.16 không). Muốn nâng thì bump có chủ đích.
        run: pip install "ruff==0.17.0"
      - name: Lint
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          POSTGRES_DB: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry poetry-plugin-export
      - name: Install dependencies
        run: |
          cd backend
          # --with dev: pytest/ruff nằm ở group dev — thiếu thì CI chết vì
          # "pytest: command not found" ngay sau khi install thành công.
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
      - name: Run migration
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops" alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops" pytest tests/ -v

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47.7 khớp deploy.yml và máy dev — pubspec.lock đã resolve với
          # Dart mới; Flutter 3.24 (Dart 3.5) không resolve được pdf ^3.12.0.
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        run: flutter analyze
      - name: Flutter test
        working-directory: frontend
        run: flutter test
      - name: Build Flutter Web
        working-directory: frontend
        run: flutter build web --release

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-web, worker-typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t bankops-api:latest backend/
      - name: Validate compose
        run: docker compose config
      - name: Verify build
        run: echo "Docker build successful"


apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kho-tra-sua
  namespace: argocd
  labels:
    app.kubernetes.io/name: kho-tra-sua-project
    app.kubernetes.io/part-of: kho-tra-sua-system
spec:
  description: "Kho-Trà-Sữa Core Banking Operations System Project"
  # Allowed source Git repositories
  sourceRepos:
    - "https://github.com/imtarget05/Kho-Trà-Sữa.git"
    - "git@github.com:imtarget05/Kho-Trà-Sữa.git"
  # Allowed destination clusters and namespaces
  destinations:
    - namespace: "kho-tra-sua-prod"
      server: "https://kubernetes.default.svc"
    - namespace: "kho-tra-sua-staging"
      server: "https://kubernetes.default.svc"
  # Cluster-scoped resources whitelist (keep minimal for security)
  clusterResourceWhitelist:
    - group: "networking.k8s.io"
      kind: "IngressClass"
  # Namespace-scoped resources whitelist
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

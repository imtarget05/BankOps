apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bankops-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: bankops-production
    app.kubernetes.io/part-of: bankops-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bankops
  source:
    repoURL: "https://github.com/imtarget05/BankOps.git"
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: "https://kubernetes.default.svc"
    namespace: bankops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bankops-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: bankops-staging
    app.kubernetes.io/part-of: bankops-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bankops
  source:
    repoURL: "https://github.com/imtarget05/BankOps.git"
    targetRevision: main
    path: infra/k8s/overlays/staging
  destination:
    server: "https://kubernetes.default.svc"
    namespace: bankops-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: v1
kind: Secret
metadata:
  name: bankops-secrets
  labels:
    app.kubernetes.io/name: bankops
    app.kubernetes.io/part-of: bankops-system
type: Opaque
# NOTE: In production GitOps, DO NOT commit raw base64 secrets.
# Use Bitnami SealedSecrets ('kubeseal < secret.yaml > sealed-secret.yaml')
# or ExternalSecrets Operator (ESO) syncing from GCP Secret Manager / AWS Secrets Manager / Vault.
stringData:
  DATABASE_URL: "postgresql+asyncpg://bankops_user:CHANGE_ME_PASSWORD@bankops-postgres:5432/bankops"

  # --- Secret ứng dụng (tên key PHẢI khớp với `backend/app/config.py`) ---
  # `BANKOPS_SIGNING_KEY`: key ký/verify JWT. Ở môi trường non-demo, app
  # FAIL-FAST nếu thiếu key này (`config.assert_runtime_secrets`).
  # Sinh bằng: `python -c "import secrets; print(secrets.token_urlsafe(48))"`
  BANKOPS_SIGNING_KEY: "CHANGE_ME_GENERATE_32_BYTE_RANDOM_SIGNING_KEY"
  # `BANKOPS_SESSION_SECRET`: ký cookie phiên. Cũng bắt buộc ở non-demo.
  BANKOPS_SESSION_SECRET: "CHANGE_ME_GENERATE_32_BYTE_RANDOM_SESSION_SECRET"

  # `SECRET_KEY`: tên LEGACY của secret deploy (đã dùng ở cluster cũ).
  # `backend/entrypoint.sh` chỉ dùng nó làm FALLBACK khi
  # `BANKOPS_SIGNING_KEY` chưa được cấp. Deploy mới PHẢI set
  # `BANKOPS_SIGNING_KEY` ở trên; giữ key này để rollout không gãy.
  SECRET_KEY: "CHANGE_ME_GENERATE_32_BYTE_RANDOM_SECRET_KEY"

  # PIN 6 số của Kiểm soát viên (duyệt phiếu quỹ giá trị cao).
  SUPERVISOR_PIN: "CHANGE_ME_SUPERVISOR_PIN"

  # --- SMTP (gửi email kích hoạt / đặt lại mật khẩu) ---
  SMTP_USER: "CHANGE_ME_SMTP_USER"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"

  CLOUDFLARE_ACCOUNT_ID: "CHANGE_ME_CF_ACCOUNT_ID"
  CLOUDFLARE_API_TOKEN: "CHANGE_ME_CF_API_TOKEN"
  CLOUDFLARE_TUNNEL_TOKEN: "CHANGE_ME_CF_TUNNEL_TOKEN"
  AWS_ACCESS_KEY_ID: "CHANGE_ME_R2_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_R2_OR_S3_ACCESS_KEY"
  BACKUP_GPG_PASSPHRASE: "CHANGE_ME_ENCRYPTION_PASSPHRASE"

apiVersion: v1
kind: Service
metadata:
  name: bankops-api
  labels:
    app.kubernetes.io/name: bankops-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bankops-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: bankops-api
---
apiVersion: v1
kind: Service
metadata:
  name: bankops-frontend
  labels:
    app.kubernetes.io/name: bankops-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: bankops-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: bankops-frontend

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bankops-ingress
  labels:
    app.kubernetes.io/name: bankops-ingress
    app.kubernetes.io/part-of: bankops-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - bankops.yourbank.com
      secretName: bankops-tls-cert
  rules:
    - host: bankops.yourbank.com
      http:
        paths:
          # Backend API & Documentation routes
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: bankops-api
                port:
                  number: 8000
          - path: /health/
            pathType: Prefix
            backend:
              service:
                name: bankops-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: bankops-api
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: bankops-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: bankops-api
                port:
                  number: 8000
          # Frontend Web SPA (Default Fallback)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bankops-frontend
                port:
                  number: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: kho-tra-sua-config
  labels:
    app.kubernetes.io/name: kho-tra-sua
    app.kubernetes.io/part-of: kho-tra-sua-system
data:
  APP_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  AI_PROVIDER: "cloudflare"
  CLOUDFLARE_MODEL: "@cf/meta/llama-3.1-8b-instruct"
  ALLOWED_ORIGINS: '["https://quanlykho.internal"]'
  BACKUP_RETENTION_DAYS: "30"
  S3_BUCKET: "kho-tra-sua-backups"
  S3_ENDPOINT: "https://<account-id>.r2.cloudflarestorage.com"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quanlykho

resources:
  - deployment-api.yaml
  - services.yaml
  - configmap.yaml
  - httproute.yaml

images:
  - name: ghcr.io/imtarget05/bankops-api
    newName: quanlykho/backend
    newTag: local

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: bankops-api

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quanlykho
  namespace: quanlykho
spec:
  parentRefs:
    - name: portfolio-gateway
      namespace: platform-gateway
      sectionName: http
  hostnames:
    - quanlykho.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bankops-api
          port: 8000

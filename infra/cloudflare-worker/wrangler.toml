name = "kho-tra-sua-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ═══════════════════════════════════════════════════════════════════════════════
# RETIRED / LEGACY BOUNDARY — health endpoints only (ADR 0001).
# FastAPI (backend/) is the canonical business API. This Worker serves only
# /api/v1/health/* and returns 410 Gone for every business path.
# Business bindings (Workers AI, ratelimits) have been removed; full archive
# of this Worker is Phase 2.
# ═══════════════════════════════════════════════════════════════════════════════

[vars]
APP_ENV = "production"

# ─── Secrets (Production) ─────────────────────────────────────────────────────
# Set via wrangler CLI — NEVER hardcode values here:
#
#   wrangler secret put UPSTREAM_API_URL
#   wrangler secret put DATABASE_URL
#
# UPSTREAM_API_URL – URL of canonical FastAPI (e.g. https://kho-tra-sua-fastapi.onrender.com)
# DATABASE_URL – Neon connection string (pooled); used by /api/v1/health/ready fallback.

# ═══════════════════════════════════════════════════════════════════════════════
# Staging environment
# ═══════════════════════════════════════════════════════════════════════════════

[env.staging]
name = "kho-tra-sua-api-staging"
vars = { APP_ENV = "staging" }

# ─── Secrets (Staging) ────────────────────────────────────────────────────────
# Set via wrangler CLI — NEVER hardcode values here:
#
#   wrangler secret put DATABASE_URL --env staging

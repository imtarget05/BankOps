name = "bankops-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# Cloudflare Workers luôn warm – không có cold start
# V8 isolate khởi động < 5ms trên toàn cầu

[vars]
APP_ENV = "production"
APP_NAME = "BankOps-API"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
ACCESS_TOKEN_EXPIRE_MINUTES = "30"
REFRESH_TOKEN_EXPIRE_DAYS = "7"

# Create and bind KV only when rate-limiting/session storage is implemented.
# Production namespace IDs must be created in the Cloudflare account first.

# Secrets (cấu hình qua: wrangler secret put <NAME>):
# DATABASE_URL       – Neon connection string (pooled)
# JWT_SECRET         – key dùng HS256 sign JWT
# SESSION_SECRET     – Starlette session secret (không dùng trên Worker, để tương thích)
# GOOGLE_CLIENT_ID   – OAuth audience

# Cron trigger giữ Worker luôn warm (tùy chọn, Workers đã zero cold start)
[triggers]
crons = ["*/5 * * * *"]   # Ping health mỗi 5 phút → giữ isolate alive

# Staging environment
[env.staging]
name = "bankops-api-staging"
vars = { APP_ENV = "staging", AI_MODEL = "@cf/meta/llama-3.1-8b-instruct" }

[env.staging.ai]
binding = "AI"



# =============================================================================
# K8s Manifests — Model Serving (Phase M — S9)
# =============================================================================
# Deployment, Service cho FastAPI inference model serving.
# - Sử dụng Docker image đã build S9.1
# - Health check endpoints optimized for kind/GCB environments
# - Resource requests/limits合理
# - Probe configs: startup → readiness → liveness theo trình tự
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-credentials
  namespace: ml-serving
type: Opaque
stringData:
  # These would be populated from external secret store in production
  # Root filesystem của container là read-only → tracking URI + artifact root
  # phải trỏ vào emptyDir /data (mỗi pod có DB riêng, tránh SQLite lock contention).
  MLFLOW_TRACKING_URI: "sqlite:////data/mlflow.db"
  MLFLOW_ARTIFACT_ROOT: "/data/mlruns"
  _MLFLOW_SERVER_ARTIFACT_ROOT: "/data/mlruns"
  MLFLOW_REGISTRY_DIR: "/data/mlruns"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-serving-config
  namespace: ml-serving
data:
  MODEL_NAME: "DemandForecastModel"
  PREDICTION_THRESHOLD: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-serving
  labels:
    app: model-serving
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      restartPolicy: Always
      # Pod-level security context — numeric UID:GID khớp với image (USER 1000:1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Để pod tắt graceful trong rolling update (drain traffic rồi mới kill)
      terminationGracePeriodSeconds: 30
      containers:
        - name: inference
          image: ghcr.io/imtarget05/quanlykho/model-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlflow-credentials
            - configMapRef:
                name: model-serving-config
          # Root filesystem là read-only → các path ghi được (MLflow DB, artifact, tmp, home)
          # nằm trên emptyDir mount riêng cho từng pod.
          volumeMounts:
            - name: model-artifact
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          # Liveness probe - kiểm tra app còn chạy (ít can thiệp vào rollout)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness probe - kiểm tra sẵn sàng phục vụ traffic
          # Thiết kế: delay moderate, tolerance cao để tránh đánh đánh nhầm pod mới
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # Startup probe - chờ app khởi động xong (tránh premature readiness)
          # /health lazy train + register model MLflow ở lần gọi đầu (10-60s)
          # → budget rộng để không kill container giữa lúc bootstrap
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 30
          # Security context
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # Volumes - model artifact được volume temporary
      # Mỗi pod có emptyDir riêng → mỗi pod một mlflow.db, không lock contention.
      volumes:
        - name: model-artifact
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-serving
  labels:
    app: model-serving
spec:
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-hpa
  namespace: ml-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-serving-pdb
  namespace: ml-serving
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: model-serving
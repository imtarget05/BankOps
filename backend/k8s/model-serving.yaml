# =============================================================================
# K8s Manifests — Model Serving (Phase M — S9)
# =============================================================================
# Deployment, Service cho FastAPI inference model serving.
# - Sử dụng Docker image đã build S9.1
# - Health check endpoints optimized for kind/GCB environments
# - Resource requests/limits leaner for kind-on-GitHubActions
# - Probe configs: startup → readiness → liveness theo trình tự, grace periods
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-credentials
  namespace: ml-serving
type: Opaque
stringData:
  # These would be populated from external secret store in production
  MLFLOW_TRACKING_URI: "sqlite:///./mlflow.db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-serving-config
  namespace: ml-serving
data:
  MODEL_NAME: "DemandForecastModel"
  PREDICTION_THRESHOLD: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-serving
  labels:
    app: model-serving
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      restartPolicy: Always
      containers:
        - name: inference
          image: ghcr.io/imtarget05/quanlykho/model-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlflow-credentials
            - configMapRef:
                name: model-serving-config
          resources:
            limits:
              cpu: "250m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          # Liveness probe - kiểm tra app còn chạy (ít can thiệp vào rollout)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 40
            timeoutSeconds: 3
            failureThreshold: 5
          # Readiness probe - kiểm tra sẵn sàng phục vụ traffic
          # Thiết kế: delay lengthier, failureThreshold cao cho environmentconstraints
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 10
          # Startup probe - chờ app khởi động xong (tránh premature readiness)
          # Cấu hình nhẹ: timeout lengthier để match kind environment
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          # Security context
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # Volumes - model artifact được volume temporary
      volumes:
        - name: model-artifact
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-serving
  labels:
    app: model-serving
spec:
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-hpa
  namespace: ml-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-serving-pdb
  namespace: ml-serving
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: model-serving
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: bankops
      POSTGRES_DB: bankops_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    # No named volume: each `make test-backend` run starts from an empty,
    # disposable database and its teardown cannot affect the developer stack.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankops -d bankops_test"]
      interval: 2s
      timeout: 3s
      retries: 20
